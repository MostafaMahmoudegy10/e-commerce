#
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

#cloudinary config
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

#jwt details
app.security.jwt.issuer=${JWT_ISSUER:auth-service}
app.security.jwt.audience=${JWT_AUDIENCE:ecommerce-service}
app.security.jwt.secret=${JWT_SECRET}

#mail api
spring.mail.protocol=smtp
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=mostafa.mahmoudegy10@gmail.com
app.api.base-url=${API_BASE_URL:http://localhost:8080}
app.dashboard.base-url=${DASHBOARD_BASE_URL:http://localhost:3000}
app.storefront.base-url=${STOREFRONT_BASE_URL:http://localhost:3000}
app.email-review.token-secret=${EMAIL_REVIEW_TOKEN_SECRET:stylehub-email-review-secret-change-me}
app.email-review.token-validity-days=${EMAIL_REVIEW_TOKEN_VALIDITY_DAYS:30}
spring.mail.properties.mail.debug=true

# rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
